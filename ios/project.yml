name: Runner
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_BUNDLE_IDENTIFIER: com.camtransfer.app
    DEVELOPMENT_TEAM: 27C9C4H26H
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: 1
targets:
  Runner:
    type: application
    platform: iOS
    sources:
      - path: Runner
      - path: Shared
    dependencies:
      - target: CameraSessionActivityWidget
        embed: true
    info:
      path: Runner/Info.plist
      properties:
        CFBundleDisplayName: CamTransfer
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: CamTransfer 需要使用蓝牙来发现并连接相机
        NSBluetoothPeripheralUsageDescription: CamTransfer 需要使用蓝牙来发现并连接相机
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: CamTransfer 需要访问本地网络以连接相机
        NSPhotoLibraryAddUsageDescription: CamTransfer 需要把下载的照片保存到你的相册
        NSPhotoLibraryUsageDescription: CamTransfer 需要读取系统相册，以显示和确认已下载的照片
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - bluetooth-central
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        INFOPLIST_FILE: Runner/Info.plist
        CODE_SIGN_ENTITLEMENTS: Runner/Runner.entitlements
        PRODUCT_NAME: Runner
        CURRENT_PROJECT_VERSION: 6
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: NO
    attributes:
      SystemCapabilities:
        com.apple.AccessWiFi:
          enabled: 1
        com.apple.HotspotConfiguration:
          enabled: 1
  CameraSessionActivityWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: CameraSessionActivityWidget
      - path: Shared
    info:
      path: CameraSessionActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: CamTransfer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camtransfer.app.CameraSessionActivityWidget
        PRODUCT_NAME: CameraSessionActivityWidget
        CURRENT_PROJECT_VERSION: 6
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
  RunnerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RunnerTests
    info:
      path: RunnerTests/Info.plist
    dependencies:
      - target: Runner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camtransfer.app.RunnerTests
        GENERATE_INFOPLIST_FILE: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Runner.app/Runner"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Runner:
    build:
      targets:
        Runner: all
        RunnerTests: [test]
    test:
      targets:
        - RunnerTests
