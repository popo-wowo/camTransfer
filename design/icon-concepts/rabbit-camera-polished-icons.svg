<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="apricot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a7"/>
      <stop offset=".52" stop-color="#ffbf70"/>
      <stop offset="1" stop-color="#ff836f"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff4ae"/>
      <stop offset=".54" stop-color="#9bce72"/>
      <stop offset="1" stop-color="#477a55"/>
    </linearGradient>
    <linearGradient id="charcoal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c4036"/>
      <stop offset=".54" stop-color="#24271f"/>
      <stop offset="1" stop-color="#11140f"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <style>
      .page { fill: #f8f7f3; }
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171b18; }
      .subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5e665f; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171b18; }
      .note { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667067; }
      .tiny { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667067; }
      .outline { stroke: #1c211d; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .softOutline { stroke: #1c211d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .fur { fill: #fff8e9; }
      .furShade { fill: #f7e9cb; }
      .earIn { fill: #ffb5a7; }
      .blush { fill: #ff918f; opacity: .9; }
      .camera { fill: #1c211d; }
      .lens { fill: #ffe37a; }
      .lens2 { fill: #b9ef9b; }
      .miniBg { fill: #fff; stroke: #d9ded7; stroke-width: 1; }
    </style>

    <g id="clean-rabbit-warm">
      <path d="M108 213C75 211 48 196 35 173c-8-15 7-29 22-20 18 11 37 17 59 17 8 0 13 7 10 15l-6 17c-2 7-6 11-12 11z" class="fur outline"/>
      <path d="M273 262c32 17 65 24 99 19 17-2 25 19 11 29-41 30-91 27-142-11-8-6-9-18-2-25l11-10c7-7 15-8 23-2z" class="fur outline"/>
      <path d="M119 284c-29 31-59 49-93 54-17 3-27-18-13-29 33-26 57-53 71-81 4-9 16-12 24-6l14 11c16 13 15 35-3 51z" class="fur outline"/>
      <path d="M121 153c17-48 65-77 124-74 62 4 110 42 121 95 15 74-48 145-143 145-82 0-126-73-102-166z" class="fur outline"/>
      <ellipse cx="286" cy="139" rx="65" ry="57" class="fur outline"/>
      <path d="M259 84C229 22 232-19 269-33c33 4 46 47 31 114-3 13-16 21-29 17-6-2-10-7-12-14z" class="fur outline"/>
      <path d="M308 96c20-66 52-98 91-88 17 33-10 76-71 110-14 8-31-6-27-21l7-1z" class="fur outline"/>
      <path d="M268 4c-7 27-5 51 4 73" class="line" stroke="#1c211d" stroke-width="7" opacity=".18"/>
      <path d="M371 28c-26 19-43 43-51 72" class="line" stroke="#1c211d" stroke-width="7" opacity=".18"/>
      <circle cx="304" cy="132" r="8.5" fill="#1c211d"/>
      <circle cx="307" cy="128" r="3" fill="#fff"/>
      <path d="M323 152c14 2 27-3 38-15" class="line" stroke="#1c211d" stroke-width="8"/>
      <circle cx="346" cy="132" r="11" class="blush"/>
      <path d="M130 163c33-38 90-41 137-5" class="line" stroke="#1c211d" stroke-width="11"/>
      <rect x="134" y="169" width="121" height="86" rx="24" class="camera"/>
      <path d="M155 169l18-24h45l18 24" class="camera"/>
      <circle cx="195" cy="213" r="29" class="lens"/>
      <circle cx="195" cy="213" r="12" fill="#fff9d8"/>
      <rect x="224" y="185" width="19" height="12" rx="5" fill="#fff3b6"/>
    </g>
  </defs>

  <rect class="page" width="1600" height="980"/>
  <text class="title" x="80" y="84">Polished Rabbit Camera Icon Drafts</text>
  <text class="subtitle" x="80" y="122">Cleaner mascot construction: closed shapes, consistent outline, readable camera, less sketchy motion.</text>

  <!-- Polished warm -->
  <g transform="translate(120 190)">
    <text class="label" x="0" y="0">P1. Warm Polished Rabbit</text>
    <text class="note" x="0" y="32">Closest to a friendly consumer app icon. Cute first, speed second.</text>
    <g transform="translate(20 78)" filter="url(#drop)">
      <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#apricot)"/>
      <path d="M44 242c52-20 113-27 184-20" class="line" stroke="#fff7df" stroke-width="23" opacity=".9"/>
      <path d="M42 302c78-22 160-28 246-18" class="line" stroke="#fff7df" stroke-width="16" opacity=".62"/>
      <g transform="translate(32 80)">
        <use href="#clean-rabbit-warm"/>
      </g>
    </g>
    <g transform="translate(20 548)">
      <rect class="miniBg" x="0" y="0" width="78" height="78" rx="18"/>
      <g transform="scale(.1857)">
        <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#apricot)"/>
        <path d="M44 242c52-20 113-27 184-20" class="line" stroke="#fff7df" stroke-width="23" opacity=".9"/>
        <g transform="translate(32 80)"><use href="#clean-rabbit-warm"/></g>
      </g>
      <text class="tiny" x="94" y="30">Most balanced: cute + product meaning.</text>
      <text class="tiny" x="94" y="54">Recommended for final refinement.</text>
    </g>
  </g>

  <!-- Polished sage -->
  <g transform="translate(610 190)">
    <text class="label" x="0" y="0">P2. Sage Polished Rabbit</text>
    <text class="note" x="0" y="32">Softer and less loud. Feels friendly, but speed is quieter.</text>
    <g transform="translate(20 78)" filter="url(#drop)">
      <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#sage)"/>
      <path d="M44 242c52-20 113-27 184-20" class="line" stroke="#f7ffe3" stroke-width="23" opacity=".86"/>
      <path d="M42 302c78-22 160-28 246-18" class="line" stroke="#f7ffe3" stroke-width="16" opacity=".58"/>
      <g transform="translate(32 80)">
        <use href="#clean-rabbit-warm"/>
        <circle cx="195" cy="213" r="29" class="lens2"/>
        <circle cx="195" cy="213" r="12" fill="#f0ffe9"/>
      </g>
    </g>
    <g transform="translate(20 548)">
      <rect class="miniBg" x="0" y="0" width="78" height="78" rx="18"/>
      <g transform="scale(.1857)">
        <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#sage)"/>
        <path d="M44 242c52-20 113-27 184-20" class="line" stroke="#f7ffe3" stroke-width="23" opacity=".86"/>
        <g transform="translate(32 80)">
          <use href="#clean-rabbit-warm"/>
          <circle cx="195" cy="213" r="29" class="lens2"/>
          <circle cx="195" cy="213" r="12" fill="#f0ffe9"/>
        </g>
      </g>
      <text class="tiny" x="94" y="30">Gentler color system.</text>
      <text class="tiny" x="94" y="54">Good if warm orange feels too playful.</text>
    </g>
  </g>

  <!-- Polished dark -->
  <g transform="translate(1100 190)">
    <text class="label" x="0" y="0">P3. Dark Polished Rabbit</text>
    <text class="note" x="0" y="32">More distinctive and mature. Still cute, but less toy-like.</text>
    <g transform="translate(20 78)" filter="url(#drop)">
      <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#charcoal)"/>
      <path d="M44 242c52-20 113-27 184-20" class="line" stroke="#bdf7a5" stroke-width="23" opacity=".86"/>
      <path d="M42 302c78-22 160-28 246-18" class="line" stroke="#fff0b6" stroke-width="16" opacity=".55"/>
      <g transform="translate(32 80)">
        <use href="#clean-rabbit-warm"/>
        <circle cx="195" cy="213" r="29" class="lens2"/>
        <circle cx="195" cy="213" r="12" fill="#f0ffe9"/>
      </g>
    </g>
    <g transform="translate(20 548)">
      <rect class="miniBg" x="0" y="0" width="78" height="78" rx="18"/>
      <g transform="scale(.1857)">
        <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#charcoal)"/>
        <path d="M44 242c52-20 113-27 184-20" class="line" stroke="#bdf7a5" stroke-width="23" opacity=".86"/>
        <g transform="translate(32 80)">
          <use href="#clean-rabbit-warm"/>
          <circle cx="195" cy="213" r="29" class="lens2"/>
          <circle cx="195" cy="213" r="12" fill="#f0ffe9"/>
        </g>
      </g>
      <text class="tiny" x="94" y="30">Highest contrast on home screen.</text>
      <text class="tiny" x="94" y="54">Less soft, more premium.</text>
    </g>
  </g>

  <g transform="translate(120 850)">
    <text class="label" x="0" y="0">Recommendation</text>
    <text class="note" x="0" y="40">P1 is the best base: it fixes the rough drawing issue while keeping the rabbit friendly and fast. The next pass should export P1 alone as a 1024 icon and tune leg/ear proportions.</text>
  </g>
</svg>
