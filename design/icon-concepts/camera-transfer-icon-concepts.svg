<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="g1" x1="140" y1="80" x2="500" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20303a"/>
      <stop offset="1" stop-color="#071014"/>
    </linearGradient>
    <linearGradient id="g2" x1="620" y1="80" x2="980" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d2733"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="g3" x1="1100" y1="80" x2="1460" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#182323"/>
      <stop offset="1" stop-color="#061011"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7bf8ff"/>
      <stop offset="1" stop-color="#00a7ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bbffd7"/>
      <stop offset="1" stop-color="#12d78a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <style>
      .page { fill: #f4f6f7; }
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111820; }
      .subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #55616c; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182029; }
      .note { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66727c; }
      .tiny { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66727c; }
      .glyph { fill: none; stroke: #f6fbff; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #f6fbff; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: none; stroke: url(#cyan); stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
      .accent2 { fill: none; stroke: url(#green); stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
      .fillWhite { fill: #f6fbff; }
      .fillCyan { fill: url(#cyan); }
      .fillGreen { fill: url(#green); }
      .miniBg { fill: #fff; stroke: #d9e0e5; stroke-width: 1; }
    </style>
  </defs>

  <rect class="page" width="1600" height="1120"/>
  <text class="title" x="80" y="84">Multi-brand Camera Transfer App Icon Concepts</text>
  <text class="subtitle" x="80" y="122">Neutral, not brand-specific. Core meaning: camera connection, wireless transfer, photo import.</text>

  <!-- Concept A -->
  <g transform="translate(80 180)">
    <text class="label" x="0" y="0">A. Camera + Wireless Arc</text>
    <text class="note" x="0" y="32">Most immediately readable: generic camera body, lens, signal arc, tiny photo cue.</text>
    <g transform="translate(0 72)" filter="url(#softShadow)">
      <rect x="0" y="0" width="360" height="360" rx="82" fill="url(#g1)"/>
      <rect x="84" y="130" width="192" height="126" rx="34" class="glyph"/>
      <path d="M130 130l26-34h76l26 34" class="glyph"/>
      <circle cx="180" cy="194" r="50" class="thin"/>
      <circle cx="180" cy="194" r="18" class="fillCyan"/>
      <path d="M245 92c42 14 72 47 84 90" class="accent"/>
      <path d="M280 62c58 24 101 74 116 137" class="accent" opacity=".58"/>
      <rect x="236" y="236" width="62" height="46" rx="10" fill="#f6fbff" opacity=".95"/>
      <path d="M244 268l19-19 15 14 10-9 12 14" fill="none" stroke="#00a7ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(0 472)">
      <rect class="miniBg" x="0" y="0" width="78" height="78" rx="18"/>
      <g transform="scale(.2167)">
        <rect x="0" y="0" width="360" height="360" rx="82" fill="url(#g1)"/>
        <rect x="84" y="130" width="192" height="126" rx="34" class="glyph"/>
        <path d="M130 130l26-34h76l26 34" class="glyph"/>
        <circle cx="180" cy="194" r="50" class="thin"/>
        <circle cx="180" cy="194" r="18" class="fillCyan"/>
        <path d="M245 92c42 14 72 47 84 90" class="accent"/>
        <path d="M280 62c58 24 101 74 116 137" class="accent" opacity=".58"/>
      </g>
      <text class="tiny" x="92" y="30">Small-size read: camera + wireless survives.</text>
      <text class="tiny" x="92" y="54">Best default direction.</text>
    </g>
  </g>

  <!-- Concept B -->
  <g transform="translate(560 180)">
    <text class="label" x="0" y="0">B. Lens + Transfer Beam</text>
    <text class="note" x="0" y="32">More premium and abstract. Good if final name feels fast/professional.</text>
    <g transform="translate(0 72)" filter="url(#softShadow)">
      <rect x="0" y="0" width="360" height="360" rx="82" fill="url(#g2)"/>
      <circle cx="162" cy="184" r="88" class="glyph"/>
      <circle cx="162" cy="184" r="48" class="thin" opacity=".75"/>
      <path d="M123 107l47 77h88" class="thin" opacity=".78"/>
      <path d="M101 150l69 34-31 82" class="thin" opacity=".78"/>
      <path d="M176 96l-6 88-71 48" class="thin" opacity=".78"/>
      <path d="M222 120l-52 64 27 86" class="thin" opacity=".78"/>
      <path d="M238 184h74" class="accent"/>
      <path d="M286 144l44 40-44 40" class="accent"/>
      <rect x="260" y="238" width="54" height="40" rx="9" fill="#f6fbff" opacity=".95"/>
      <circle cx="282" cy="257" r="5" fill="#00a7ff"/>
      <path d="M266 272l14-12 11 10 8-7 9 9" fill="none" stroke="#00a7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(0 472)">
      <rect class="miniBg" x="0" y="0" width="78" height="78" rx="18"/>
      <g transform="scale(.2167)">
        <rect x="0" y="0" width="360" height="360" rx="82" fill="url(#g2)"/>
        <circle cx="162" cy="184" r="88" class="glyph"/>
        <circle cx="162" cy="184" r="48" class="thin" opacity=".75"/>
        <path d="M238 184h74" class="accent"/>
        <path d="M286 144l44 40-44 40" class="accent"/>
      </g>
      <text class="tiny" x="92" y="30">Small-size read: premium transfer,</text>
      <text class="tiny" x="92" y="54">but camera meaning is less explicit.</text>
    </g>
  </g>

  <!-- Concept C -->
  <g transform="translate(1040 180)">
    <text class="label" x="0" y="0">C. Photo Stack + Wireless Pulse</text>
    <text class="note" x="0" y="32">Photo-import centric. Feels more utility/app-store friendly than hardware-specific.</text>
    <g transform="translate(0 72)" filter="url(#softShadow)">
      <rect x="0" y="0" width="360" height="360" rx="82" fill="url(#g3)"/>
      <rect x="94" y="116" width="158" height="122" rx="24" class="glyph"/>
      <rect x="124" y="146" width="158" height="122" rx="24" class="thin" opacity=".75"/>
      <circle cx="134" cy="158" r="11" class="fillGreen"/>
      <path d="M113 214l42-42 31 32 22-22 44 50" fill="none" stroke="#f6fbff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M210 102c42 12 74 43 89 84" class="accent2"/>
      <path d="M244 70c56 22 98 68 116 126" class="accent2" opacity=".58"/>
      <path d="M95 274h144" class="accent2"/>
      <path d="M204 242l35 32-35 32" class="accent2"/>
    </g>
    <g transform="translate(0 472)">
      <rect class="miniBg" x="0" y="0" width="78" height="78" rx="18"/>
      <g transform="scale(.2167)">
        <rect x="0" y="0" width="360" height="360" rx="82" fill="url(#g3)"/>
        <rect x="94" y="116" width="158" height="122" rx="24" class="glyph"/>
        <rect x="124" y="146" width="158" height="122" rx="24" class="thin" opacity=".75"/>
        <path d="M210 102c42 12 74 43 89 84" class="accent2"/>
        <path d="M95 274h144" class="accent2"/>
        <path d="M204 242l35 32-35 32" class="accent2"/>
      </g>
      <text class="tiny" x="92" y="30">Small-size read: photo transfer,</text>
      <text class="tiny" x="92" y="54">camera connection is implied.</text>
    </g>
  </g>

  <g transform="translate(80 820)">
    <text class="label" x="0" y="0">Recommendation</text>
    <text class="note" x="0" y="42">Start from A, then simplify further for production: fewer inner lines, stronger lens circle, one recognizable wireless arc.</text>
    <text class="note" x="0" y="78">Avoid using brand colors or camera silhouettes that resemble major camera brands bodies too closely.</text>
    <text class="note" x="0" y="114">If the final product name emphasizes speed, blend A with B: camera body plus one cyan transfer beam through the lens.</text>
  </g>
</svg>
