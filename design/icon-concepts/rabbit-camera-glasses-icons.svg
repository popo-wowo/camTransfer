<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <radialGradient id="warmBg" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="#ffeab5"/>
      <stop offset=".52" stop-color="#efb26d"/>
      <stop offset="1" stop-color="#c87463"/>
    </radialGradient>
    <radialGradient id="sageBg" cx=".28" cy=".22" r=".92">
      <stop offset="0" stop-color="#f2f0c1"/>
      <stop offset=".54" stop-color="#b4c680"/>
      <stop offset="1" stop-color="#617b5d"/>
    </radialGradient>
    <radialGradient id="nightBg" cx=".3" cy=".22" r=".9">
      <stop offset="0" stop-color="#5b5259"/>
      <stop offset=".56" stop-color="#2b252c"/>
      <stop offset="1" stop-color="#141216"/>
    </radialGradient>
    <linearGradient id="furLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset=".62" stop-color="#f3e2c0"/>
      <stop offset="1" stop-color="#dcb98d"/>
    </linearGradient>
    <linearGradient id="furSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset=".62" stop-color="#f1e0bc"/>
      <stop offset="1" stop-color="#d3b08b"/>
    </linearGradient>
    <linearGradient id="lensWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b4"/>
      <stop offset=".45" stop-color="#f3c56e"/>
      <stop offset="1" stop-color="#a96a43"/>
    </linearGradient>
    <linearGradient id="lensMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4c1"/>
      <stop offset=".45" stop-color="#b7da86"/>
      <stop offset="1" stop-color="#5d825e"/>
    </linearGradient>
    <linearGradient id="lensRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdcb8"/>
      <stop offset=".45" stop-color="#e7a57e"/>
      <stop offset="1" stop-color="#9a6977"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <style>
      .page { fill: #f7f4ee; }
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171410; }
      .subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #696054; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171410; }
      .note { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #72685b; }
      .tiny { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #72685b; }
      .miniBg { fill: #fff; stroke: #ded8cc; stroke-width: 1; }
      .outline { stroke: #221c19; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .eyeDot { fill: #201916; }
      .blush { fill: #ef8d92; opacity: .75; }
      .goggleFrame { fill: #211b18; }
    </style>

    <g id="rabbit-face">
      <path d="M140 166C105 95 112 35 156 11c33 24 42 75 23 141-4 16-25 22-37 11l-2 3z" fill="url(#furLight)" class="outline"/>
      <path d="M274 166c35-71 28-131-16-155-33 24-42 75-23 141 4 16 25 22 37 11l2 3z" fill="url(#furLight)" class="outline"/>
      <ellipse cx="208" cy="208" rx="110" ry="94" fill="url(#furLight)" class="outline"/>
      <ellipse cx="129" cy="222" rx="28" ry="24" fill="url(#furSoft)" class="outline"/>
      <ellipse cx="287" cy="222" rx="28" ry="24" fill="url(#furSoft)" class="outline"/>
      <path d="M175 95c-4 28-1 54 10 78" class="line" stroke="#6f5947" stroke-width="7" opacity=".18"/>
      <path d="M241 95c4 28 1 54-10 78" class="line" stroke="#6f5947" stroke-width="7" opacity=".18"/>
      <circle cx="156" cy="261" r="12" class="blush"/>
      <circle cx="260" cy="261" r="12" class="blush"/>
      <path d="M192 282c10 10 22 10 32 0" class="line" stroke="#221c19" stroke-width="8"/>
      <path d="M142 308c41 24 93 24 134 0" class="line" stroke="#221c19" stroke-width="11"/>
    </g>

    <g id="camera-glasses-warm">
      <rect x="118" y="177" width="74" height="66" rx="24" class="goggleFrame"/>
      <rect x="224" y="177" width="74" height="66" rx="24" class="goggleFrame"/>
      <rect x="186" y="198" width="40" height="16" rx="8" class="goggleFrame"/>
      <circle cx="155" cy="210" r="22" fill="url(#lensWarm)"/>
      <circle cx="261" cy="210" r="22" fill="url(#lensWarm)"/>
      <circle cx="155" cy="210" r="10" fill="#2a2320"/>
      <circle cx="261" cy="210" r="10" fill="#2a2320"/>
      <circle cx="149" cy="203" r="4.5" fill="#fff5d9"/>
      <circle cx="255" cy="203" r="4.5" fill="#fff5d9"/>
    </g>

    <g id="camera-glasses-mint">
      <rect x="118" y="177" width="74" height="66" rx="24" class="goggleFrame"/>
      <rect x="224" y="177" width="74" height="66" rx="24" class="goggleFrame"/>
      <rect x="186" y="198" width="40" height="16" rx="8" class="goggleFrame"/>
      <circle cx="155" cy="210" r="22" fill="url(#lensMint)"/>
      <circle cx="261" cy="210" r="22" fill="url(#lensMint)"/>
      <circle cx="155" cy="210" r="10" fill="#26231f"/>
      <circle cx="261" cy="210" r="10" fill="#26231f"/>
      <circle cx="149" cy="203" r="4.5" fill="#fbffe5"/>
      <circle cx="255" cy="203" r="4.5" fill="#fbffe5"/>
    </g>

    <g id="camera-glasses-rose">
      <rect x="118" y="177" width="74" height="66" rx="24" class="goggleFrame"/>
      <rect x="224" y="177" width="74" height="66" rx="24" class="goggleFrame"/>
      <rect x="186" y="198" width="40" height="16" rx="8" class="goggleFrame"/>
      <circle cx="155" cy="210" r="22" fill="url(#lensRose)"/>
      <circle cx="261" cy="210" r="22" fill="url(#lensRose)"/>
      <circle cx="155" cy="210" r="10" fill="#2d2328"/>
      <circle cx="261" cy="210" r="10" fill="#2d2328"/>
      <circle cx="149" cy="203" r="4.5" fill="#fff1e8"/>
      <circle cx="255" cy="203" r="4.5" fill="#fff1e8"/>
    </g>
  </defs>

  <rect class="page" width="1600" height="1040"/>
  <text class="title" x="80" y="84">Rabbit With Camera Glasses</text>
  <text class="subtitle" x="80" y="122">The rabbit face stays cute; the goggles become the camera. Cleaner than carrying a camera prop.</text>

  <g transform="translate(110 190)">
    <text class="label" x="0" y="0">G1. Warm Camera Glasses</text>
    <text class="note" x="0" y="32">Friendliest version. Cute face first, camera meaning second, still premium enough for an app icon.</text>
    <g transform="translate(20 78)" filter="url(#drop)">
      <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#warmBg)"/>
      <path d="M48 262c63-27 130-37 201-29" class="line" stroke="#fff2d2" stroke-width="24" opacity=".9"/>
      <path d="M50 319c93-25 187-30 281-15" class="line" stroke="#fff2d2" stroke-width="16" opacity=".55"/>
      <g transform="translate(2 52)">
        <use href="#rabbit-face"/>
        <use href="#camera-glasses-warm"/>
      </g>
    </g>
    <g transform="translate(20 548)">
      <rect class="miniBg" x="0" y="0" width="78" height="78" rx="18"/>
      <g transform="scale(.1857)">
        <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#warmBg)"/>
        <path d="M48 262c63-27 130-37 201-29" class="line" stroke="#fff2d2" stroke-width="24" opacity=".9"/>
        <g transform="translate(2 52)">
          <use href="#rabbit-face"/>
          <use href="#camera-glasses-warm"/>
        </g>
      </g>
      <text class="tiny" x="94" y="30">Most approachable and balanced.</text>
      <text class="tiny" x="94" y="54">Best first candidate.</text>
    </g>
  </g>

  <g transform="translate(600 190)">
    <text class="label" x="0" y="0">G2. Sage Camera Glasses</text>
    <text class="note" x="0" y="32">Softer and calmer. Reads more like a lifestyle photography tool.</text>
    <g transform="translate(20 78)" filter="url(#drop)">
      <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#sageBg)"/>
      <path d="M48 262c63-27 130-37 201-29" class="line" stroke="#faffdd" stroke-width="24" opacity=".86"/>
      <path d="M50 319c93-25 187-30 281-15" class="line" stroke="#faffdd" stroke-width="16" opacity=".52"/>
      <g transform="translate(2 52)">
        <use href="#rabbit-face"/>
        <use href="#camera-glasses-mint"/>
      </g>
    </g>
    <g transform="translate(20 548)">
      <rect class="miniBg" x="0" y="0" width="78" height="78" rx="18"/>
      <g transform="scale(.1857)">
        <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#sageBg)"/>
        <path d="M48 262c63-27 130-37 201-29" class="line" stroke="#faffdd" stroke-width="24" opacity=".86"/>
        <g transform="translate(2 52)">
          <use href="#rabbit-face"/>
          <use href="#camera-glasses-mint"/>
        </g>
      </g>
      <text class="tiny" x="94" y="30">Calmer and less sweet.</text>
      <text class="tiny" x="94" y="54">Good if warm tones feel too playful.</text>
    </g>
  </g>

  <g transform="translate(1090 190)">
    <text class="label" x="0" y="0">G3. Night Camera Glasses</text>
    <text class="note" x="0" y="32">Most premium. The rabbit stays cute, while the dark background makes the glasses feel expensive.</text>
    <g transform="translate(20 78)" filter="url(#drop)">
      <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#nightBg)"/>
      <path d="M48 262c63-27 130-37 201-29" class="line" stroke="#f0d5ab" stroke-width="24" opacity=".82"/>
      <path d="M50 319c93-25 187-30 281-15" class="line" stroke="#f0d5ab" stroke-width="16" opacity=".42"/>
      <g transform="translate(2 52)">
        <use href="#rabbit-face"/>
        <use href="#camera-glasses-rose"/>
      </g>
    </g>
    <g transform="translate(20 548)">
      <rect class="miniBg" x="0" y="0" width="78" height="78" rx="18"/>
      <g transform="scale(.1857)">
        <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#nightBg)"/>
        <path d="M48 262c63-27 130-37 201-29" class="line" stroke="#f0d5ab" stroke-width="24" opacity=".82"/>
        <g transform="translate(2 52)">
          <use href="#rabbit-face"/>
          <use href="#camera-glasses-rose"/>
        </g>
      </g>
      <text class="tiny" x="94" y="30">Strongest premium feel.</text>
      <text class="tiny" x="94" y="54">Still cute, less childish.</text>
    </g>
  </g>

  <g transform="translate(110 850)">
    <text class="label" x="0" y="0">Recommendation</text>
    <text class="note" x="0" y="42">G3 is the strongest “cute but高级” direction. G1 is easier to like immediately. If this becomes the production icon, the next pass should make the goggles 6-8% larger and simplify the mouth curve.</text>
  </g>
</svg>
