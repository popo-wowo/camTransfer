<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8a8"/>
      <stop offset=".55" stop-color="#ffb36e"/>
      <stop offset="1" stop-color="#ff7d7a"/>
    </linearGradient>
    <linearGradient id="creamGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3bc"/>
      <stop offset=".52" stop-color="#bedb76"/>
      <stop offset="1" stop-color="#6aa062"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d4a58"/>
      <stop offset=".52" stop-color="#342b38"/>
      <stop offset="1" stop-color="#17151d"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <style>
      .page { fill: #f8f7f3; }
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171b18; }
      .subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #62685e; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171b18; }
      .note { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667067; }
      .tiny { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667067; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .fur { fill: #fff9ec; }
      .fur2 { fill: #fff1d7; }
      .ink { fill: #22231f; }
      .stroke { stroke: #22231f; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .strokeThin { stroke: #22231f; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .ear { fill: #ffb6a7; }
      .blush { fill: #ff8e95; opacity: .82; }
      .camera { fill: #22231f; }
      .lensGold { fill: #ffe16f; }
      .lensGreen { fill: #c8ef8b; }
      .lensPink { fill: #ffc1b7; }
      .miniBg { fill: #fff; stroke: #d9ded7; stroke-width: 1; }
    </style>

    <g id="chibi-front">
      <ellipse cx="210" cy="246" rx="72" ry="62" class="fur stroke"/>
      <ellipse cx="146" cy="236" rx="25" ry="22" class="fur strokeThin"/>
      <ellipse cx="274" cy="236" rx="25" ry="22" class="fur strokeThin"/>
      <path d="M162 285c-17 17-34 27-51 29" class="line stroke"/>
      <path d="M258 285c17 17 34 27 51 29" class="line stroke"/>
      <circle cx="159" cy="306" r="15" class="fur strokeThin"/>
      <circle cx="261" cy="306" r="15" class="fur strokeThin"/>
      <ellipse cx="210" cy="156" rx="88" ry="82" class="fur stroke"/>
      <path d="M155 91c-22-57-12-96 24-110 33 10 43 54 23 113-5 14-23 18-34 8l-13-11z" class="fur stroke"/>
      <path d="M265 91c22-57 12-96-24-110-33 10-43 54-23 113 5 14 23 18 34 8l13-11z" class="fur stroke"/>
      <path d="M177 7c-4 29-1 54 9 76" class="line" stroke="#22231f" stroke-width="7" opacity=".16"/>
      <path d="M243 7c4 29 1 54-9 76" class="line" stroke="#22231f" stroke-width="7" opacity=".16"/>
      <ellipse cx="181" cy="151" rx="9" ry="12" class="ink"/>
      <ellipse cx="239" cy="151" rx="9" ry="12" class="ink"/>
      <circle cx="184" cy="147" r="3" fill="#fff"/>
      <circle cx="242" cy="147" r="3" fill="#fff"/>
      <path d="M203 174c5 5 9 5 14 0" class="line strokeThin"/>
      <circle cx="157" cy="175" r="12" class="blush"/>
      <circle cx="263" cy="175" r="12" class="blush"/>
      <path d="M154 221c32-24 79-24 112 0" class="line stroke"/>
      <rect x="146" y="214" width="128" height="88" rx="24" class="camera"/>
      <path d="M169 214l18-23h46l18 23" class="camera"/>
      <circle cx="210" cy="260" r="31" class="lensGold"/>
      <circle cx="210" cy="260" r="12" fill="#fff9d6"/>
      <rect x="241" y="232" width="18" height="11" rx="5" fill="#fff0b1"/>
    </g>
  </defs>

  <rect class="page" width="1600" height="980"/>
  <text class="title" x="80" y="84">Cuter Chibi Rabbit + Camera Icon Drafts</text>
  <text class="subtitle" x="80" y="122">Changed the mascot structure: big head, tiny body, simple camera, motion handled by background trails.</text>

  <g transform="translate(120 190)">
    <text class="label" x="0" y="0">Q1. Peach Chibi Courier</text>
    <text class="note" x="0" y="32">Cute-first. The rabbit is not literally sprinting; the background carries the fast feeling.</text>
    <g transform="translate(20 78)" filter="url(#drop)">
      <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#peach)"/>
      <path d="M39 254c55-22 119-30 193-23" class="line" stroke="#fff8df" stroke-width="24" opacity=".9"/>
      <path d="M48 312c83-24 170-30 260-18" class="line" stroke="#fff8df" stroke-width="16" opacity=".62"/>
      <g transform="translate(0 62)"><use href="#chibi-front"/></g>
    </g>
    <g transform="translate(20 548)">
      <rect class="miniBg" x="0" y="0" width="78" height="78" rx="18"/>
      <g transform="scale(.1857)">
        <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#peach)"/>
        <path d="M39 254c55-22 119-30 193-23" class="line" stroke="#fff8df" stroke-width="24" opacity=".9"/>
        <g transform="translate(0 62)"><use href="#chibi-front"/></g>
      </g>
      <text class="tiny" x="94" y="30">Cutest and most approachable.</text>
      <text class="tiny" x="94" y="54">Best base if mascot is the brand.</text>
    </g>
  </g>

  <g transform="translate(610 190)">
    <text class="label" x="0" y="0">Q2. Green Chibi Courier</text>
    <text class="note" x="0" y="32">Less sweet than peach, still friendly. Avoids blue and obvious camera-brand colors.</text>
    <g transform="translate(20 78)" filter="url(#drop)">
      <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#creamGreen)"/>
      <path d="M39 254c55-22 119-30 193-23" class="line" stroke="#fbffe4" stroke-width="24" opacity=".86"/>
      <path d="M48 312c83-24 170-30 260-18" class="line" stroke="#fbffe4" stroke-width="16" opacity=".58"/>
      <g transform="translate(0 62)">
        <use href="#chibi-front"/>
        <circle cx="210" cy="260" r="31" class="lensGreen"/>
        <circle cx="210" cy="260" r="12" fill="#f7ffe7"/>
      </g>
    </g>
    <g transform="translate(20 548)">
      <rect class="miniBg" x="0" y="0" width="78" height="78" rx="18"/>
      <g transform="scale(.1857)">
        <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#creamGreen)"/>
        <path d="M39 254c55-22 119-30 193-23" class="line" stroke="#fbffe4" stroke-width="24" opacity=".86"/>
        <g transform="translate(0 62)">
          <use href="#chibi-front"/>
          <circle cx="210" cy="260" r="31" class="lensGreen"/>
          <circle cx="210" cy="260" r="12" fill="#f7ffe7"/>
        </g>
      </g>
      <text class="tiny" x="94" y="30">Friendly and calmer.</text>
      <text class="tiny" x="94" y="54">Less cute-pop than Q1.</text>
    </g>
  </g>

  <g transform="translate(1100 190)">
    <text class="label" x="0" y="0">Q3. Plum Night Courier</text>
    <text class="note" x="0" y="32">Dark but not blue. More distinctive; works if the app wants a premium mascot identity.</text>
    <g transform="translate(20 78)" filter="url(#drop)">
      <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#plum)"/>
      <path d="M39 254c55-22 119-30 193-23" class="line" stroke="#ffe8a8" stroke-width="24" opacity=".83"/>
      <path d="M48 312c83-24 170-30 260-18" class="line" stroke="#ffb8aa" stroke-width="16" opacity=".54"/>
      <g transform="translate(0 62)">
        <use href="#chibi-front"/>
        <circle cx="210" cy="260" r="31" class="lensPink"/>
        <circle cx="210" cy="260" r="12" fill="#fff2ea"/>
      </g>
    </g>
    <g transform="translate(20 548)">
      <rect class="miniBg" x="0" y="0" width="78" height="78" rx="18"/>
      <g transform="scale(.1857)">
        <rect x="0" y="0" width="420" height="420" rx="96" fill="url(#plum)"/>
        <path d="M39 254c55-22 119-30 193-23" class="line" stroke="#ffe8a8" stroke-width="24" opacity=".83"/>
        <g transform="translate(0 62)">
          <use href="#chibi-front"/>
          <circle cx="210" cy="260" r="31" class="lensPink"/>
          <circle cx="210" cy="260" r="12" fill="#fff2ea"/>
        </g>
      </g>
      <text class="tiny" x="94" y="30">Most premium and distinctive.</text>
      <text class="tiny" x="94" y="54">Still cute, less childish.</text>
    </g>
  </g>

  <g transform="translate(120 850)">
    <text class="label" x="0" y="0">Recommendation</text>
    <text class="note" x="0" y="40">Q1 is the cleanest cute direction. It avoids the ugly full-body running pose; the mascot can become the app's recognizable identity while speed stays in the background trails.</text>
  </g>
</svg>
