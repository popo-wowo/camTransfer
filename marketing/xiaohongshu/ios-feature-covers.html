<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CamTransfer iOS Feature Covers</title>
  <style>
    :root {
      --ink: #111;
      --pink: #ff3f77;
      --yellow: #ffe45d;
      --cream: #fff6e5;
      --paper: #fffaf0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ece7da;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .poster {
      position: relative;
      width: 1242px;
      height: 1656px;
      overflow: hidden;
      border-radius: 38px;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.95) 0 10%, transparent 11%),
        radial-gradient(circle at 26% 78%, rgba(255, 63, 119, 0.16), transparent 30%),
        radial-gradient(circle at 88% 72%, rgba(255, 207, 64, 0.26), transparent 28%),
        linear-gradient(145deg, rgba(255, 251, 238, 0.96), rgba(255, 239, 216, 0.9)),
        #f7dfc7;
      color: var(--ink);
    }

    .note-card {
      position: absolute;
      right: 42px;
      top: 46px;
      width: 410px;
      height: 275px;
      transform: rotate(5deg);
      background: #f4e3b7;
      border-radius: 10px;
      opacity: 0.68;
      box-shadow: 0 18px 50px rgba(75, 43, 17, 0.18);
    }

    .note-card::before {
      content: "";
      position: absolute;
      inset: 24px;
      background: repeating-linear-gradient(to bottom, transparent 0 34px, rgba(86, 70, 36, 0.18) 35px 36px);
    }

    .headline {
      position: absolute;
      left: 78px;
      top: 102px;
      z-index: 12;
      width: 1040px;
      transform: rotate(-4.5deg);
      font-size: 124px;
      line-height: 1.02;
      font-weight: 1000;
      letter-spacing: 0;
      color: var(--ink);
      text-shadow:
        12px 0 #fff, -12px 0 #fff, 0 12px #fff, 0 -12px #fff,
        9px 9px #fff, -9px -9px #fff, -9px 9px #fff, 9px -9px #fff,
        0 24px 0 rgba(255,255,255,0.76),
        0 30px 26px rgba(62, 35, 20, 0.12);
    }

    .headline strong {
      color: var(--pink);
      font-weight: 1000;
    }

    .brush {
      position: absolute;
      left: 240px;
      top: 334px;
      z-index: 13;
      width: 800px;
      height: 112px;
      transform: rotate(-4deg);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 58px;
      font-weight: 900;
      letter-spacing: 0;
      background: var(--pink);
      border-radius: 50px 28px 46px 34px;
      box-shadow:
        0 0 0 9px rgba(255,255,255,0.96),
        0 13px 0 rgba(255,255,255,0.9),
        0 26px 34px rgba(191, 27, 73, 0.18);
      text-shadow: 0 2px 0 rgba(0,0,0,0.04);
    }

    .brush::before,
    .brush::after {
      content: "";
      position: absolute;
      left: -58px;
      right: -44px;
      height: 10px;
      border-radius: 99px;
      background: #fff;
      opacity: 0.9;
    }
    .brush::before { bottom: -20px; transform: rotate(-1deg); }
    .brush::after { bottom: -40px; left: 78px; right: 120px; transform: rotate(-4deg); }

    .badge {
      position: absolute;
      left: 72px;
      top: 500px;
      z-index: 14;
      width: 390px;
      height: 138px;
      transform: rotate(-5deg);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 58px 48px 62px 42px;
      background: var(--yellow);
      border: 9px solid #fff;
      box-shadow: 0 0 0 3px rgba(255, 228, 93, 0.45), 0 18px 25px rgba(70, 50, 12, .18);
      font-size: 38px;
      font-weight: 1000;
    }

    .badge::before {
      content: "";
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 13px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      transform: rotate(-3deg);
    }

    .badge .icon {
      position: relative;
      z-index: 1;
      font-size: 58px;
      line-height: 1;
      transform: rotate(-12deg);
    }

    .badge .text {
      position: relative;
      z-index: 1;
      white-space: nowrap;
    }

    .camera {
      position: absolute;
      left: 70px;
      top: 690px;
      width: 510px;
      height: 350px;
      transform: rotate(-4deg);
      filter: drop-shadow(0 28px 34px rgba(25, 16, 10, 0.28));
      z-index: 2;
    }

    .camera-body {
      position: absolute;
      left: 24px;
      top: 82px;
      width: 456px;
      height: 238px;
      border-radius: 42px;
      background: linear-gradient(#cfc8b9 0 42%, #171717 42% 100%);
      border: 8px solid #1a1a1a;
      overflow: hidden;
    }

    .camera-body::before {
      content: "";
      position: absolute;
      inset: 120px 22px 20px;
      border-radius: 20px;
      background: repeating-linear-gradient(90deg, #101010 0 10px, #242424 10px 16px);
      opacity: .9;
    }

    .camera-top {
      position: absolute;
      left: 88px;
      top: 40px;
      width: 330px;
      height: 88px;
      border-radius: 22px 22px 12px 12px;
      background: linear-gradient(#ded8c9, #aaa394);
      border: 7px solid #1b1b1b;
    }

    .dial {
      position: absolute;
      top: 18px;
      width: 98px;
      height: 98px;
      border-radius: 50%;
      background: radial-gradient(circle, #e2dccf 0 24%, #8c867b 25% 48%, #222 49% 54%, #bab4a9 55%);
      border: 8px solid #1b1b1b;
    }
    .dial.left { left: 72px; }
    .dial.right { right: 74px; }

    .lens {
      position: absolute;
      left: 178px;
      top: 104px;
      width: 226px;
      height: 226px;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 48%, #384f3e 0 9%, #111 10% 24%, #3d3a36 25% 32%, #111 33% 42%, #6c665d 43% 51%, #171717 52%);
      border: 14px solid #1c1c1c;
      box-shadow: inset 0 0 0 12px #2a2a2a, 0 10px 18px rgba(0,0,0,.35);
    }

    .phone {
      position: absolute;
      right: 92px;
      top: 510px;
      width: 414px;
      height: 858px;
      z-index: 5;
      transform: rotate(2.5deg);
      border-radius: 60px;
      background: #0d0d0f;
      padding: 16px;
      box-shadow: 0 36px 56px rgba(28, 20, 14, 0.34);
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 24px;
      left: 50%;
      width: 124px;
      height: 36px;
      margin-left: -62px;
      border-radius: 999px;
      background: #111;
      z-index: 8;
    }

    .screen {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 46px;
      background: #f8f5ee;
      border: 2px solid rgba(255,255,255,.12);
    }

    .status {
      height: 60px;
      padding: 18px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
    }

    .app-title { padding: 2px 22px 10px; }
    .brand {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2.2px;
      color: #9b8358;
    }
    .copy {
      margin-top: 6px;
      font-size: 13px;
      color: #6d665d;
      font-weight: 600;
    }

    .chips {
      display: flex;
      gap: 8px;
      padding: 0 22px 12px;
      flex-wrap: wrap;
    }
    .chip {
      border: 1px solid rgba(17,17,17,.12);
      background: rgba(255,255,255,.75);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 800;
    }
    .chip.active { background: #111; color: #fff; }
    .chip.pink { background: var(--pink); color: #fff; border-color: transparent; }

    .grid {
      padding: 0 18px 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .thumb {
      position: relative;
      height: 110px;
      border-radius: 16px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }

    .thumb:nth-child(1) { background-image: linear-gradient(140deg, #2d533d, #ffa3b3 48%, #f5d17a); }
    .thumb:nth-child(2) { background-image: linear-gradient(140deg, #293848, #86bdd0 45%, #ffd890); }
    .thumb:nth-child(3) { background-image: linear-gradient(140deg, #52301e, #efb68f 46%, #f8e0ba); }
    .thumb:nth-child(4) { background-image: linear-gradient(140deg, #223553, #94b1da 50%, #f7c47b); }
    .thumb:nth-child(5) { background-image: linear-gradient(140deg, #203f37, #f79aa0 48%, #ffe3ad); }
    .thumb:nth-child(6) { background-image: linear-gradient(140deg, #2b2b2c, #79736b 45%, #d8c0a0); }
    .thumb:nth-child(7) { background-image: linear-gradient(140deg, #634b2c, #f2d49f 52%, #9dc9ba); }
    .thumb:nth-child(8) { background-image: linear-gradient(140deg, #1c3152, #e89572 45%, #f7e5ad); }
    .thumb:nth-child(9) { background-image: linear-gradient(140deg, #26351f, #df7d9d 46%, #ffe9a8); }

    .thumb::after {
      content: "JPG";
      position: absolute;
      right: 6px;
      bottom: 6px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255,255,255,.82);
      font-size: 7px;
      font-weight: 900;
    }

    .check {
      position: absolute;
      left: 7px;
      top: 7px;
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #111;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
    }

    .selection-path {
      position: absolute;
      left: 66px;
      top: 310px;
      width: 268px;
      height: 98px;
      border: 9px solid var(--pink);
      border-left-color: transparent;
      border-bottom-color: transparent;
      border-radius: 70px;
      transform: rotate(5deg);
      opacity: 0.9;
    }
    .selection-path::after {
      content: "👆";
      position: absolute;
      right: -30px;
      top: -28px;
      font-size: 50px;
      transform: rotate(18deg);
      filter: drop-shadow(0 4px 0 #fff);
    }

    .bottom-bar,
    .download-panel {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      padding: 16px;
      border-radius: 28px;
      background: rgba(255, 252, 245, 0.94);
      border: 1px solid rgba(17,17,17,.10);
      box-shadow: 0 16px 32px rgba(40, 30, 16, 0.16);
      backdrop-filter: blur(14px);
    }

    .bottom-bar {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 0 20px;
    }
    .bottom-bar b { font-size: 15px; }
    .black-pill {
      padding: 11px 17px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .preview-photo {
      margin: 8px 24px 0;
      height: 560px;
      border-radius: 26px;
      background: linear-gradient(145deg, #8dc8e8 0 26%, #fff3c0 27% 39%, #254c38 40% 58%, #f29aad 59% 78%, #f8d58d 79%);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
    }
    .preview-top {
      height: 78px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 0 22px 14px;
      color: #fff;
      background: linear-gradient(to bottom, rgba(0,0,0,.42), transparent);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
    }
    .preview-title { font-size: 14px; font-weight: 800; }
    .preview-button {
      padding: 10px 16px;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-size: 13px;
      font-weight: 900;
    }
    .preview-note {
      position: absolute;
      left: 34px;
      right: 34px;
      bottom: 42px;
      padding: 18px 22px;
      border-radius: 26px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 15px 28px rgba(0,0,0,.12);
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .filter-panel {
      margin: 8px 20px 0;
      padding: 18px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 14px 28px rgba(40, 30, 16, 0.12);
    }
    .filter-title {
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 12px;
    }
    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .result-note {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 18px;
      background: #fff2f6;
      color: var(--pink);
      font-weight: 900;
      font-size: 13px;
    }

    .photo-strip {
      position: absolute;
      left: 54px;
      bottom: 96px;
      width: 410px;
      height: 206px;
      transform: rotate(-8deg);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 18px;
      background: #fff;
      box-shadow: 0 20px 40px rgba(30, 20, 12, 0.18);
    }
    .photo-strip span {
      display: block;
      border-radius: 2px;
      background-size: cover;
    }
    .photo-a { background-image: linear-gradient(140deg, #2e493f, #e2a783 45%, #f9d25e); }
    .photo-b { background-image: linear-gradient(135deg, #485d82, #dfc79d 48%, #9d533b); }
    .photo-c { background-image: linear-gradient(135deg, #344530, #eb9caa 50%, #f7dca2); }
    .photo-d { background-image: linear-gradient(135deg, #1f2e45, #79a6b8 46%, #f0c36a); }

    .speech {
      position: absolute;
      left: 456px;
      bottom: 118px;
      z-index: 8;
      min-width: 420px;
      min-height: 106px;
      transform: rotate(-4deg);
      display: grid;
      place-items: center;
      padding: 18px 30px;
      border-radius: 52px;
      background: #fff;
      border: 6px solid #111;
      font-size: 42px;
      line-height: 1.1;
      font-weight: 900;
    }
    .speech::after {
      content: "";
      position: absolute;
      right: 80px;
      bottom: -28px;
      width: 48px;
      height: 48px;
      background: #fff;
      border-right: 6px solid #111;
      border-bottom: 6px solid #111;
      transform: rotate(32deg);
    }

    .doodle {
      position: absolute;
      z-index: 9;
      color: var(--pink);
      font-weight: 1000;
      font-size: 58px;
      text-shadow: 4px 0 #fff, -4px 0 #fff, 0 4px #fff, 0 -4px #fff;
    }
    .d1 { left: 84px; top: 390px; transform: rotate(-18deg); }
    .d2 { right: 74px; top: 86px; transform: rotate(15deg); color: #ffc928; }
    .d3 { left: 566px; top: 948px; transform: rotate(-7deg); }

    .footer-mark {
      position: absolute;
      left: 76px;
      bottom: 34px;
      z-index: 9;
      padding: 16px 24px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="poster">
    <div class="note-card"></div>
    <div class="headline" id="headline"></div>
    <div class="brush" id="brush"></div>
    <div class="badge"><span class="icon" id="badgeIcon"></span><span class="text" id="badgeText"></span></div>

    <div class="camera" aria-hidden="true">
      <div class="camera-top"></div>
      <div class="dial left"></div>
      <div class="dial right"></div>
      <div class="camera-body"></div>
      <div class="lens"></div>
    </div>

    <section class="phone">
      <div class="screen" id="screen"></div>
    </section>

    <div class="photo-strip">
      <span class="photo-a"></span>
      <span class="photo-b"></span>
      <span class="photo-c"></span>
      <span class="photo-d"></span>
    </div>
    <div class="speech" id="speech"></div>
    <div class="doodle d1">↘</div>
    <div class="doodle d2">!!</div>
    <div class="doodle d3">♡</div>
    <div class="footer-mark">招募富士用户内测</div>
  </main>

  <script>
    const thumbs = Array.from({ length: 9 }, (_, index) => {
      const checked = [0, 2, 4].includes(index) ? '<span class="check">✓</span>' : '';
      return `<div class="thumb">${checked}</div>`;
    }).join('');

    const galleryScreen = (options = {}) => `
      <div class="status"><span>9:41</span><span>●●● 5G</span></div>
      <div class="app-title">
        <div class="brand">X-T5 GALLERY</div>
        <div class="copy">${options.copy || '已连接相机 Wi-Fi，选择想下载的照片。'}</div>
      </div>
      <div class="chips">
        ${(options.chips || ['今天', 'JPG', 'HEIF', 'RAW']).map((chip, index) =>
          `<span class="chip ${index === 0 || chip.active ? 'active' : ''} ${chip.pink ? 'pink' : ''}">${chip.label || chip}</span>`
        ).join('')}
      </div>
      ${options.filterPanel || ''}
      <div class="grid">${thumbs}</div>
      ${options.path ? '<div class="selection-path"></div>' : ''}
      ${options.bottom || '<div class="bottom-bar"><b>已选 3 张</b><span class="black-pill">下载原图</span></div>'}
    `;

    const previewScreen = `
      <div class="preview-top">
        <span class="preview-title">DSCF1024.JPG</span>
        <span class="preview-button">下载原图</span>
      </div>
      <div class="status"><span>9:41</span><span>●●● 5G</span></div>
      <div class="preview-photo"></div>
      <div class="preview-note"><span>只下载当前这一张</span><span class="black-pill">下载原图</span></div>
    `;

    const variants = {
      single: {
        headline: '只想下<strong>这一张?</strong>',
        brush: '点开照片直接下载!',
        badgeIcon: '📸',
        badgeText: '单张下载',
        speech: '不用全选一堆~',
        screen: previewScreen
      },
      multiselect: {
        headline: '照片太多<strong>懒得点?</strong>',
        brush: '滑一下就能多选!',
        badgeIcon: '👆',
        badgeText: '滑动多选',
        speech: '一划选中好多张~',
        screen: galleryScreen({
          copy: '拖过照片即可连续选择，底部直接下载原图。',
          path: true,
          bottom: '<div class="bottom-bar"><b>已选 8 张</b><span class="black-pill">下载原图</span></div>'
        })
      },
      filter: {
        headline: '找照片<strong>太费劲?</strong>',
        brush: '日期格式一键筛!',
        badgeIcon: '🔎',
        badgeText: '筛选更省心',
        speech: 'RAW/JPG 分开找~',
        screen: galleryScreen({
          copy: '按日期和格式筛选，先找到再下载。',
          chips: [
            { label: '今天', active: true },
            { label: '选择日期' },
            { label: 'JPG', active: true },
            { label: 'HEIF', active: true },
            { label: 'RAW', pink: true },
            { label: '视频' }
          ],
          filterPanel: `
            <div class="filter-panel">
              <div class="filter-title">筛选相机照片</div>
              <div class="filter-row">
                <span class="chip active">今天</span>
                <span class="chip">选择日期</span>
              </div>
              <div class="filter-row">
                <span class="chip active">JPG</span>
                <span class="chip active">HEIF</span>
                <span class="chip pink">RAW</span>
                <span class="chip">视频</span>
              </div>
              <div class="result-note">已筛出 24 张可下载照片</div>
            </div>
          `,
          bottom: '<div class="bottom-bar"><b>筛选后已选 3 张</b><span class="black-pill">下载原图</span></div>'
        })
      }
    };

    const feature = new URLSearchParams(location.search).get('feature') || 'single';
    const data = variants[feature] || variants.single;
    document.getElementById('headline').innerHTML = data.headline;
    document.getElementById('brush').textContent = data.brush;
    document.getElementById('badgeIcon').textContent = data.badgeIcon;
    document.getElementById('badgeText').textContent = data.badgeText;
    document.getElementById('speech').textContent = data.speech;
    document.getElementById('screen').innerHTML = data.screen;
  </script>
</body>
</html>
