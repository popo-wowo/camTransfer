<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CamTransfer iOS Speed Cover</title>
  <style>
    :root {
      --ink: #111111;
      --pink: #ff3f77;
      --yellow: #ffe45d;
      --paper: #fffaf0;
      --muted: #6b645d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ece7da;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .poster {
      position: relative;
      width: 1242px;
      height: 1656px;
      overflow: hidden;
      border-radius: 38px;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.9) 0 10%, transparent 11%),
        linear-gradient(145deg, rgba(255, 251, 238, 0.96), rgba(255, 239, 216, 0.9)),
        #f7dfc7;
      color: var(--ink);
    }

    .desk-shadow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 76%, rgba(255, 77, 119, 0.14), transparent 24%),
        radial-gradient(circle at 88% 72%, rgba(255, 207, 64, 0.28), transparent 28%),
        linear-gradient(100deg, rgba(255,255,255,0.52), rgba(255,255,255,0) 42%);
      pointer-events: none;
    }

    .note-card {
      position: absolute;
      width: 410px;
      height: 275px;
      right: 42px;
      top: 46px;
      transform: rotate(5deg);
      background: #f4e3b7;
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(75, 43, 17, 0.18);
      opacity: 0.68;
    }

    .note-card::before {
      content: "";
      position: absolute;
      inset: 24px;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 34px,
        rgba(86, 70, 36, 0.18) 35px 36px
      );
    }

    .photo-strip {
      position: absolute;
      left: 54px;
      bottom: 96px;
      width: 410px;
      height: 206px;
      transform: rotate(-8deg);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 18px;
      background: #fff;
      box-shadow: 0 20px 40px rgba(30, 20, 12, 0.18);
    }

    .photo-strip span,
    .tiny-print span {
      display: block;
      border-radius: 2px;
      background-size: cover;
      background-position: center;
    }

    .photo-a { background-image: linear-gradient(140deg, #2e493f, #e2a783 45%, #f9d25e); }
    .photo-b { background-image: linear-gradient(135deg, #485d82, #dfc79d 48%, #9d533b); }
    .photo-c { background-image: linear-gradient(135deg, #344530, #eb9caa 50%, #f7dca2); }
    .photo-d { background-image: linear-gradient(135deg, #1f2e45, #79a6b8 46%, #f0c36a); }

    .tape {
      position: absolute;
      width: 150px;
      height: 48px;
      border-radius: 9px;
      background: repeating-linear-gradient(
        -45deg,
        rgba(255, 213, 96, 0.92) 0 16px,
        rgba(255, 235, 153, 0.92) 16px 31px
      );
      box-shadow: 0 10px 24px rgba(97, 61, 4, 0.12);
    }

    .tape.one { right: 214px; bottom: 372px; transform: rotate(-12deg); }
    .tape.two { left: 250px; bottom: 318px; transform: rotate(8deg); background: repeating-linear-gradient(-45deg, rgba(255,108,145,.9) 0 16px, rgba(255,188,205,.9) 16px 31px); }

    .headline {
      position: absolute;
      left: 86px;
      top: 104px;
      z-index: 12;
      transform: rotate(-4.5deg);
      font-size: 128px;
      line-height: 1.02;
      font-weight: 1000;
      letter-spacing: 0;
      color: #111;
      text-shadow:
        12px 0 #fff, -12px 0 #fff, 0 12px #fff, 0 -12px #fff,
        9px 9px #fff, -9px -9px #fff, -9px 9px #fff, 9px -9px #fff,
        0 24px 0 rgba(255,255,255,0.76),
        0 30px 26px rgba(62, 35, 20, 0.12);
    }

    .headline strong {
      color: var(--pink);
      text-shadow:
        12px 0 #fff, -12px 0 #fff, 0 12px #fff, 0 -12px #fff,
        9px 9px #fff, -9px -9px #fff, -9px 9px #fff, 9px -9px #fff,
        0 24px 0 rgba(255,255,255,0.76),
        0 30px 26px rgba(62, 35, 20, 0.12);
    }

    .brush {
      position: absolute;
      left: 250px;
      top: 332px;
      z-index: 13;
      width: 780px;
      height: 112px;
      transform: rotate(-4deg);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 58px;
      font-weight: 900;
      letter-spacing: 0;
      background: var(--pink);
      border-radius: 50px 28px 46px 34px;
      box-shadow:
        0 0 0 9px rgba(255,255,255,0.96),
        0 13px 0 rgba(255,255,255,0.9),
        0 26px 34px rgba(191, 27, 73, 0.18);
      text-shadow: 0 2px 0 rgba(0,0,0,0.04);
    }

    .brush::before,
    .brush::after {
      content: "";
      position: absolute;
      left: -58px;
      right: -44px;
      height: 10px;
      border-radius: 99px;
      background: #fff;
      opacity: 0.9;
    }
    .brush::before { bottom: -20px; transform: rotate(-1deg); }
    .brush::after { bottom: -40px; left: 78px; right: 120px; transform: rotate(-4deg); }

    .camera {
      position: absolute;
      left: 82px;
      top: 650px;
      width: 500px;
      height: 342px;
      transform: rotate(-3deg);
      filter: drop-shadow(0 28px 34px rgba(25, 16, 10, 0.28));
      z-index: 2;
    }

    .camera-body {
      position: absolute;
      left: 24px;
      top: 82px;
      width: 446px;
      height: 230px;
      border-radius: 42px;
      background:
        linear-gradient(#cfc8b9 0 42%, #171717 42% 100%);
      border: 8px solid #1a1a1a;
      overflow: hidden;
    }

    .camera-body::before {
      content: "";
      position: absolute;
      inset: 116px 22px 20px;
      border-radius: 20px;
      background: repeating-linear-gradient(90deg, #101010 0 10px, #242424 10px 16px);
      opacity: .9;
    }

    .camera-top {
      position: absolute;
      left: 88px;
      top: 40px;
      width: 320px;
      height: 86px;
      border-radius: 22px 22px 12px 12px;
      background: linear-gradient(#ded8c9, #aaa394);
      border: 7px solid #1b1b1b;
    }

    .dial {
      position: absolute;
      top: 18px;
      width: 98px;
      height: 98px;
      border-radius: 50%;
      background: radial-gradient(circle, #e2dccf 0 24%, #8c867b 25% 48%, #222 49% 54%, #bab4a9 55%);
      border: 8px solid #1b1b1b;
    }
    .dial.left { left: 72px; }
    .dial.right { right: 74px; }

    .lens {
      position: absolute;
      left: 176px;
      top: 104px;
      width: 218px;
      height: 218px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 45% 48%, #384f3e 0 9%, #111 10% 24%, #3d3a36 25% 32%, #111 33% 42%, #6c665d 43% 51%, #171717 52%);
      border: 14px solid #1c1c1c;
      box-shadow: inset 0 0 0 12px #2a2a2a, 0 10px 18px rgba(0,0,0,.35);
    }

    .phone {
      position: absolute;
      right: 96px;
      top: 515px;
      width: 392px;
      height: 812px;
      z-index: 4;
      transform: rotate(2.5deg);
      border-radius: 58px;
      background: #0d0d0f;
      padding: 16px;
      box-shadow: 0 36px 56px rgba(28, 20, 14, 0.34);
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 24px;
      left: 50%;
      width: 124px;
      height: 36px;
      margin-left: -62px;
      border-radius: 999px;
      background: #111;
      z-index: 8;
    }

    .screen {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 44px;
      background: #f8f5ee;
      border: 2px solid rgba(255,255,255,.12);
    }

    .status {
      height: 60px;
      padding: 18px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      color: #171717;
    }

    .app-title {
      padding: 2px 22px 10px;
    }

    .brand {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2.2px;
      color: #9b8358;
    }

    .copy {
      margin-top: 6px;
      font-size: 13px;
      color: #6d665d;
      font-weight: 600;
    }

    .chips {
      display: flex;
      gap: 8px;
      padding: 0 22px 12px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid rgba(17,17,17,.12);
      background: rgba(255,255,255,.75);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      color: #202020;
    }

    .chip.active {
      background: #111;
      color: #fff;
    }

    .grid {
      padding: 0 18px 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .thumb {
      position: relative;
      height: 108px;
      border-radius: 16px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }

    .thumb:nth-child(1) { background-image: linear-gradient(140deg, #2d533d, #ffa3b3 48%, #f5d17a); }
    .thumb:nth-child(2) { background-image: linear-gradient(140deg, #293848, #86bdd0 45%, #ffd890); }
    .thumb:nth-child(3) { background-image: linear-gradient(140deg, #52301e, #efb68f 46%, #f8e0ba); }
    .thumb:nth-child(4) { background-image: linear-gradient(140deg, #223553, #94b1da 50%, #f7c47b); }
    .thumb:nth-child(5) { background-image: linear-gradient(140deg, #203f37, #f79aa0 48%, #ffe3ad); }
    .thumb:nth-child(6) { background-image: linear-gradient(140deg, #2b2b2c, #79736b 45%, #d8c0a0); }
    .thumb:nth-child(7) { background-image: linear-gradient(140deg, #634b2c, #f2d49f 52%, #9dc9ba); }
    .thumb:nth-child(8) { background-image: linear-gradient(140deg, #1c3152, #e89572 45%, #f7e5ad); }
    .thumb:nth-child(9) { background-image: linear-gradient(140deg, #26351f, #df7d9d 46%, #ffe9a8); }

    .thumb::after {
      content: "JPG";
      position: absolute;
      right: 6px;
      bottom: 6px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255,255,255,.82);
      font-size: 7px;
      font-weight: 900;
    }

    .check {
      position: absolute;
      left: 7px;
      top: 7px;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #111;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
    }

    .download-panel {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      padding: 16px;
      border-radius: 28px;
      background: rgba(255, 252, 245, 0.94);
      border: 1px solid rgba(17,17,17,.10);
      box-shadow: 0 16px 32px rgba(40, 30, 16, 0.16);
      backdrop-filter: blur(14px);
    }

    .download-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .download-row b {
      font-size: 14px;
    }

    .speed {
      color: var(--pink);
      font-size: 14px;
      font-weight: 900;
    }

    .bar {
      height: 9px;
      border-radius: 99px;
      overflow: hidden;
      background: #e6e1d7;
      margin-bottom: 10px;
    }

    .bar span {
      display: block;
      width: 88%;
      height: 100%;
      border-radius: 99px;
      background: var(--pink);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      color: #8a8177;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .toggle {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 46px;
      border-radius: 999px;
      background: #ede9e2;
      padding: 4px;
      font-size: 15px;
      font-weight: 800;
      color: #222;
      text-align: center;
      line-height: 38px;
    }

    .toggle::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: calc(50% - 4px);
      height: 38px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 6px 12px rgba(0,0,0,.10);
    }

    .toggle span {
      position: relative;
      z-index: 1;
    }

    .comparison {
      position: absolute;
      left: 64px;
      top: 646px;
      z-index: 7;
      width: 376px;
      display: grid;
      gap: 18px;
      transform: rotate(-2deg);
    }

    .time-card {
      position: relative;
      padding: 20px 24px;
      border-radius: 24px;
      background: #fff;
      border: 6px solid #fff;
      box-shadow: 0 12px 0 rgba(17,17,17,.08), 0 18px 30px rgba(52, 29, 18, 0.18);
    }

    .time-card.slow {
      outline: 5px solid #f3c8d2;
    }

    .time-card.fast {
      outline: 5px solid var(--yellow);
    }

    .time-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 28px;
      font-weight: 900;
    }

    .time {
      margin-top: 8px;
      font-size: 50px;
      line-height: 1;
      font-weight: 1000;
    }

    .slow .time { color: #8a8a8a; }
    .fast .time { color: var(--pink); }

    .mini-bar {
      margin-top: 14px;
      height: 12px;
      border-radius: 999px;
      background: #eee7df;
      overflow: hidden;
    }
    .mini-bar span { display: block; height: 100%; border-radius: 999px; }
    .slow .mini-bar span { width: 36%; background: #a5a5a5; }
    .fast .mini-bar span { width: 92%; background: var(--pink); }

    .speed-badge {
      position: absolute;
      left: 72px;
      top: 492px;
      z-index: 14;
      width: 352px;
      height: 136px;
      transform: rotate(-5deg);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: 58px 48px 62px 42px;
      background: var(--yellow);
      border: 9px solid #fff;
      box-shadow:
        0 0 0 3px rgba(255, 228, 93, 0.45),
        0 18px 25px rgba(70, 50, 12, .18);
      font-size: 35px;
      font-weight: 1000;
      letter-spacing: 0;
      filter: drop-shadow(0 14px 12px rgba(65, 42, 10, 0.14));
    }

    .speed-badge::before {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 12px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      transform: rotate(-3deg);
    }

    .rocket {
      position: relative;
      z-index: 1;
      font-size: 58px;
      line-height: 1;
      transform: rotate(-12deg);
      filter: drop-shadow(0 4px 0 rgba(255,255,255,0.8));
    }

    .speed-text {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: baseline;
      gap: 8px;
      white-space: nowrap;
    }

    .speed-text em {
      color: var(--pink);
      font-style: normal;
      font-size: 76px;
      line-height: .86;
      text-shadow:
        4px 0 #fff, -4px 0 #fff, 0 4px #fff, 0 -4px #fff,
        0 8px 0 rgba(255,255,255,0.6);
    }

    .speech {
      position: absolute;
      left: 456px;
      bottom: 118px;
      z-index: 8;
      width: 420px;
      min-height: 106px;
      transform: rotate(-4deg);
      display: grid;
      place-items: center;
      padding: 18px 30px;
      border-radius: 52px;
      background: #fff;
      border: 6px solid #111;
      font-size: 42px;
      line-height: 1.1;
      font-weight: 900;
    }

    .speech::after {
      content: "";
      position: absolute;
      right: 80px;
      bottom: -28px;
      width: 48px;
      height: 48px;
      background: #fff;
      border-right: 6px solid #111;
      border-bottom: 6px solid #111;
      transform: rotate(32deg);
    }

    .doodle {
      position: absolute;
      z-index: 9;
      color: var(--pink);
      font-weight: 1000;
      font-size: 46px;
      text-shadow: 4px 0 #fff, -4px 0 #fff, 0 4px #fff, 0 -4px #fff;
    }

    .d1 { left: 84px; top: 390px; transform: rotate(-18deg); font-size: 64px; }
    .d2 { right: 74px; top: 86px; transform: rotate(15deg); color: #ffc928; font-size: 64px; }
    .d3 { left: 556px; top: 936px; transform: rotate(-7deg); }
    .d4 { display: none; }

    .spark {
      position: absolute;
      z-index: 6;
      width: 22px;
      height: 22px;
      background: #fff;
      transform: rotate(45deg);
      box-shadow: 0 0 0 5px #ffd73d;
    }

    .s1 { left: 62px; top: 560px; }
    .s2 { left: 642px; top: 447px; transform: rotate(45deg) scale(.7); }
    .s3 { display: none; }

    .footer-mark {
      position: absolute;
      left: 76px;
      bottom: 34px;
      z-index: 9;
      padding: 16px 24px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="CamTransfer 小红书速度卖点封面">
    <div class="desk-shadow"></div>
    <div class="note-card"></div>
    <div class="tape one"></div>
    <div class="tape two"></div>
    <div class="photo-strip">
      <span class="photo-a"></span>
      <span class="photo-b"></span>
      <span class="photo-c"></span>
      <span class="photo-d"></span>
    </div>
    <h1 class="headline">富士传图<strong>太慢?</strong></h1>
    <div class="brush">试试我做的 App!</div>

    <section class="comparison" aria-label="下载耗时对比">
      <div class="time-card slow">
        <div class="time-title"><span>原厂 App</span><span>慢</span></div>
        <div class="time">2:48</div>
        <div class="mini-bar"><span></span></div>
      </div>
      <div class="time-card fast">
        <div class="time-title"><span>CamTransfer</span><span>快</span></div>
        <div class="time">1:00</div>
        <div class="mini-bar"><span></span></div>
      </div>
    </section>
    <div class="speed-badge">
      <span class="rocket">🚀</span>
      <span class="speed-text">快 <em>2.8</em> 倍</span>
    </div>

    <div class="camera" aria-hidden="true">
      <div class="camera-top"></div>
      <div class="dial left"></div>
      <div class="dial right"></div>
      <div class="camera-body"></div>
      <div class="lens"></div>
    </div>

    <section class="phone" aria-label="iPhone 上的 CamTransfer iOS 界面">
      <div class="screen">
        <div class="status"><span>9:41</span><span>●●● 5G</span></div>
        <div class="app-title">
          <div class="brand">X-T5 GALLERY</div>
          <div class="copy">已连接相机 Wi-Fi，正在下载原图。</div>
        </div>
        <div class="chips">
          <span class="chip active">今天</span>
          <span class="chip">JPG</span>
          <span class="chip">HEIF</span>
          <span class="chip">RAW</span>
        </div>
        <div class="grid">
          <div class="thumb"><span class="check">✓</span></div>
          <div class="thumb"></div>
          <div class="thumb"><span class="check">✓</span></div>
          <div class="thumb"></div>
          <div class="thumb"><span class="check">✓</span></div>
          <div class="thumb"></div>
          <div class="thumb"></div>
          <div class="thumb"></div>
          <div class="thumb"></div>
        </div>
        <div class="download-panel">
          <div class="download-row">
            <b>正在下载 3 张</b>
            <span class="speed">快 2.8 倍</span>
          </div>
          <div class="bar"><span></span></div>
          <div class="meta"><span>18.6 MB / 24.3 MB</span><span>剩余 1 秒</span></div>
          <div class="toggle"><span>原图</span><span>压缩</span></div>
        </div>
      </div>
    </section>

    <div class="speech">拍完马上到手机~</div>
    <div class="doodle d1">↘</div>
    <div class="doodle d2">!!</div>
    <div class="doodle d3">♡</div>
    <div class="doodle d4">★</div>
    <span class="spark s1"></span>
    <span class="spark s2"></span>
    <span class="spark s3"></span>
    <div class="footer-mark">招募富士用户内测</div>
  </main>
</body>
</html>
